<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Selo Circular Oficial GlicoCare com o Coala Guardião Lufy e Sensor FreeStyle Libre -->
  <circle cx="80" cy="80" r="75" fill="#F6F3EE" stroke="#7C533F" stroke-width="4"/>
  <circle cx="80" cy="80" r="68" fill="#EAE4D9" stroke="#C7BAA7" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Folhinhas de eucalipto decorativas ao fundo (símbolo de calma e natureza) -->
  <path d="M26 75 C18 62, 28 48, 38 56 C34 65, 30 72, 26 75 Z" fill="#3B7E48" opacity="0.25"/>
  <path d="M134 75 C142 62, 132 48, 122 56 C126 65, 130 72, 134 75 Z" fill="#3B7E48" opacity="0.25"/>

  <!-- Orelhas felpudas do Coala Lufy -->
  <circle cx="38" cy="54" r="22" fill="#8D8276"/>
  <circle cx="38" cy="54" r="13" fill="#F6F3EE"/>
  <circle cx="122" cy="54" r="22" fill="#8D8276"/>
  <circle cx="122" cy="54" r="13" fill="#F6F3EE"/>

  <!-- Corpo e Ombros Acolhedores -->
  <path d="M40 136 C40 104, 120 104, 120 136" fill="#9E9387"/>
  <!-- Peito marfim suave -->
  <ellipse cx="80" cy="126" rx="22" ry="16" fill="#F6F3EE"/>

  <!-- Braço esquerdo com o Sensor FreeStyle Libre em destaque -->
  <ellipse cx="49" cy="120" rx="13" ry="18" transform="rotate(-12 49 120)" fill="#8D8276"/>
  <!-- Sensor FreeStyle Libre (disco branco com centro e halo Verde Alívio #3B7E48) -->
  <circle cx="46" cy="118" r="9.5" fill="#FFFFFF" stroke="#3B7E48" stroke-width="2.5"/>
  <circle cx="46" cy="118" r="3.2" fill="#3B7E48"/>
  <!-- Ondas suaves de leitura contínua do sensor -->
  <path d="M33 112 Q29 118 33 124" stroke="#3B7E48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cabeça do Coala Lufy -->
  <circle cx="80" cy="68" r="36" fill="#A69B8F"/>

  <!-- Bochechas coradas de afeto -->
  <ellipse cx="56" cy="76" rx="6" ry="3.5" fill="#D99B82" opacity="0.65"/>
  <ellipse cx="104" cy="76" rx="6" ry="3.5" fill="#D99B82" opacity="0.65"/>

  <!-- Olhos serenos e brilhantes -->
  <circle cx="65" cy="64" r="4.5" fill="#2E2824"/>
  <circle cx="66.5" cy="62.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="95" cy="64" r="4.5" fill="#2E2824"/>
  <circle cx="96.5" cy="62.5" r="1.5" fill="#FFFFFF"/>

  <!-- Nariz característico de coala em tom Café Quente -->
  <ellipse cx="80" cy="72" rx="8" ry="11" fill="#2E2824"/>
  <ellipse cx="78" cy="69" rx="2.5" ry="3.5" fill="#5A4F47"/>

  <!-- Sorriso calmo e acolhedor -->
  <path d="M71 86 Q80 93 89 86" stroke="#2E2824" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
